{title:'第2条（適用範囲および利用目的）',clauses:[['第1項','本規約は、本システムを利用するすべての利用者に適用します。'],['第2項','本システムは、NPS（顧客推奨度）をはじめとする顧客評価やアンケート結果の共有・閲覧を通じて、サービス品質の向上および業務改善に役立てることを目的とします。'],['第3項','また、レポート配信の自動化により、従来の配信頻度のばらつきを解消し、日々の継続的かつ安定した情報共有を実現することを目的とします。'],['第4項','利用者は、本規約および管理者からの案内に従って本システムを利用するものとします。'],['第5項','利用者は、NPS発信グループへの参加、またはNPS閲覧アカウントの作成もしくはログインを行った時点で、本規約の内容を確認し、これに同意したものとみなします。']]},
{title:'第3条（アカウントの管理）',clauses:[['第1項','利用者は、ユーザーID、パスワードおよび連携するLINEアカウントを適切に管理するものとします。'],['第2項','アカウントの第三者への貸与、共有および不正利用を禁止します。'],['第3項','アカウント情報の漏えいや不正利用が疑われる場合は、速やかに管理者へ連絡してください。'],['第4項','利用権限は管理者が設定・変更できるものとします。']]},
{title:'第4条（レポートの取り扱い）',clauses:[['第1項','本システムで配信・表示されるレポートは、業務上の情報共有を目的としています。'],['第2項','レポートおよび関連情報の無断転載、外部公開、第三者への提供を禁止します。ただし、業務上必要な範囲で管理者の許可を得た場合を除きます。'],['第3項','レポートの内容には、集計元データや配信処理の都合により、誤り・欠落・遅延が生じる場合があります。'],['第4項','内容に疑問や誤りがある場合は、管理者へお問い合わせください。']]},

{title:'第6条（不適切な表現の定義）',lead:'本システムでは、主に以下の表現を不適切な表現として取り扱います。',clauses:[['第1項','特定の従業員に対する侮辱や人格を否定する表現'],['第2項','LGBTQ+をはじめ、個人の属性や多様性を否定・差別する表現'],['第3項','暴言、脅迫など、相手に恐怖や不快感を与える攻撃的な表現'],['第4項','性的な嫌がらせや、その他公序良俗に反する表現']]},
{title:'第7条（不適切な表現の自動検知）',clauses:[['第1項','本システムでは、レポート内の不適切な表現を検知するため、登録されたNGワードと文字認識技術を利用しています。'],['第2項','不適切な表現が検知された場合、コメントを除外し、スコアのみのレポートを配信することがあります。'],['第3項','自動検知は文章の意味や文脈を完全に判断するものではなく、文字認識の誤りなどにより、不適切でないコメントが検知される場合があります。'],['第4項','誤判定が疑われる場合は、元のレポートを確認し、必要に応じてコメントの共有などの対応を行います。'],['第5項','接客やサービスに対する正当な意見・改善要望は、その内容だけを理由に不適切な表現とはみなしません。']]},
{title:'第8条（システムの運用・変更・停止）',clauses:[['第1項','管理者は、保守、機能改善、障害対応などのため、本システムの機能を変更または一時停止することがあります。'],['第2項','システム障害や外部サービスの不具合などにより、レポートの配信・閲覧が遅延または停止する場合があります。'],['第3項','必要に応じて、利用権限や提供機能を変更することがあります。'],['第4項','重要な変更や運用終了については、可能な範囲で事前に案内します。']]},
{title:'第9条（利用履歴・情報の管理）',clauses:[['第1項','本システムでは、ログイン情報、レポートの閲覧履歴、コメント、お問い合わせ内容など、運用に必要な情報を記録する場合があります。'],['第2項','記録された情報は、利用状況の確認、システムの管理、障害対応および不正利用の防止などに使用します。'],['第3項','管理者は、記録された情報を業務上必要な範囲で適切に取り扱うものとします。']]},
{title:'第10条（禁止事項）',lead:'利用者は、以下の行為を行ってはなりません。',clauses:[['第1項','他人のアカウントを無断で使用する行為'],['第2項','システムへの不正アクセスや運用を妨害する行為'],['第3項','レポートや利用者情報を無断で外部へ公開する行為'],['第4項','他の利用者に対する嫌がらせや誹謗中傷'],['第5項','その他、管理者が本システムの適切な運用を妨げると判断する行為']]},
{title:'第11条（規約の掲載および変更）',clauses:[['第1項','本規約は、管理者が指定するWebサイトに掲載するものとします。'],['第2項','管理者は、運用状況やシステムの変更などに応じて、法令上認められる範囲で、利用者への事前の予告なく本規約の内容を変更する場合があります。'],['第3項','規約を変更した場合は、当該Webサイトに掲載する内容を更新するものとします。'],['第4項','重要な変更については、法令上必要な場合を含め、変更内容および適用時期をLINE公式アカウントなどを通じて利用者へ案内します。'],['第5項','最新の規約は、当該Webサイトに掲載されている内容を基準とします。'],['第6項','利用者は、変更後の規約が適用された後も、NPS発信グループへの参加を継続し、レポートの受信・閲覧、またはNPS閲覧アカウントへのログインなど、本システムの利用を継続した場合、法令上認められる範囲で、変更後の規約に同意したものとみなします。']]},

ementById(location.hash.slice(1));if(target)requestAnimationFrame(()=>target.scrollIntoView())}update();
